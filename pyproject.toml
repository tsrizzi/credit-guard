[project]
name = "credit-guard"
version = "0.1.0"
description = "Camada de sustentacao de um modelo de credit scoring: contratos de dados, drift, observabilidade e governanca."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datadog>=0.56.0",
    "dvc>=3.67.1",
    "dvc-gdrive>=3.0.1",
    "evidently>=0.7,<0.8",
    "fastapi>=0.162.7",
    "joblib>=1.6.0",
    "mlflow>=3",
    "numpy>=1.26,<2.4",
    "pandas>=2.2,<3",
    "pandera>=0.36",
    "prometheus-client>=0.26.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "tabulate>=0.10.0",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_guard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # o formatter controla o tamanho do codigo; templates HTML/docs ficam livres

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # deprecacoes internas de dependencias de terceiros (nao do nosso codigo)
    "ignore::DeprecationWarning:evidently.*",
    "ignore::DeprecationWarning:litestar.*",
    "ignore::DeprecationWarning:numpy.*",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
