stages:
  prepare:
    cmd: python -m credit_guard.data.prepare
    deps:
      - data/raw/application_train.csv
      - src/credit_guard/data
      - src/credit_guard/contracts
    params:
      - seed
      - prepare
      - contract
    outs:
      - data/reference
      - data/holdout
      - data/protected
      - data/quarantine
      - reports/validation/reference_raw.json:
          cache: false
      - reports/validation/reference_raw.html:
          cache: false
  train:
    cmd: python -m credit_guard.model.train
    deps:
      - data/reference
      - src/credit_guard/model
    params:
      - seed
      - model
    outs:
      - models
      - reports/model/feature_importance.csv:
          cache: false
    metrics:
      - reports/model/metrics.json:
          cache: false
  simulate:
    cmd: python -m credit_guard.simulation.simulate
    deps:
      - data/holdout
      - data/quarantine
      - src/credit_guard/simulation/drift.py
      - src/credit_guard/simulation/dirty.py
      - src/credit_guard/simulation/simulate.py
    params:
      - seed
      - simulation
    outs:
      - data/production
      - data/dirty
      - reports/simulation/manifest.json:
          cache: false
  contract_check:
    cmd: >-
      python -m credit_guard.contracts.ingest --input data/dirty/dirty_batch.parquet
      --report-dir reports/validation --name dirty_batch --expect-reject
      && python -m credit_guard.contracts.ingest --input data/production/month_01.parquet
      --report-dir reports/validation --name month_01
    deps:
      - data/dirty
      - data/production
      - src/credit_guard/contracts
    outs:
      - reports/validation/dirty_batch.json:
          cache: false
      - reports/validation/dirty_batch.html:
          cache: false
      - reports/validation/month_01.json:
          cache: false
      - reports/validation/month_01.html:
          cache: false
  monitor:
    cmd: python -m credit_guard.monitoring.monitor
    deps:
      - data/production
      - data/reference
      - data/protected
      - models
      - src/credit_guard/monitoring
    params:
      - monitoring
    outs:
      - reports/monitoring:
          cache: false
      - reports/drift:
          cache: false
      - reports/causal:
          cache: false
